<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Diseño Gráfico</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <section id="hero">
    <div id="hero-pin-spacer">
      <div id="hero-sticky">
        <video id="hero-video" src="assets/video/hero-pan.mp4" muted playsinline preload="auto"></video>

        <button id="cta-button" type="button">Conocer portafolio ↓</button>

        <nav id="service-menu" aria-label="Servicios">
          <ul id="service-menu-list"></ul>
        </nav>
      </div>
    </div>
  </section>

  <div id="about-panel" class="category-panel" hidden>
    <div class="panel-topbar">
      <button id="about-panel-close" type="button">← volver</button>
    </div>
    <div class="panel-header">
      <div class="panel-featured-image">
        <img src="assets/img/about-me.jpg" alt="Juan Jacobo — técnico en diseño gráfico">
      </div>
      <div class="panel-intro">
        <p class="panel-label">Sobre mí</p>
        <h2>Juan Jacobo</h2>
        <p>Técnico en diseño gráfico — Unitécnica, Manizales.</p>
      </div>
    </div>
    <p class="section-label">Contacto</p>
    <div class="about-links">
      <a class="about-link" href="https://wa.me/573022740249" target="_blank" rel="noopener">WhatsApp</a>
      <a class="about-link" href="https://www.instagram.com/j_j.p_p/" target="_blank" rel="noopener">Instagram</a>
      <a class="about-link" href="https://www.linkedin.com/in/juan-jacobo-puentes-palomino-4956792ab" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>

  <div id="category-panel" class="category-panel" hidden>
    <div class="panel-topbar">
      <button id="panel-close" type="button">← volver</button>
    </div>
    <div class="panel-header">
      <div class="panel-featured-image">
        <img id="panel-featured-img" src="" alt="">
      </div>
      <div class="panel-intro">
        <p class="panel-label" id="panel-label"></p>
        <h2 id="panel-title"></h2>
        <p id="panel-description"></p>
      </div>
    </div>
    <p class="section-label">Proyectos seleccionados</p>
    <div class="panel-projects" id="panel-projects"></div>
    <div class="panel-large-blocks" id="panel-large-blocks"></div>
  </div>

  <script src="js/categories-data.js"></script>
  <script src="js/scroll-utils.js"></script>
  <script src="js/router.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
